name: One-time unpack project

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="JimsOpsManual_GitHub_Ready_v1_0_0.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ZIP is already gone; nothing to unpack."
            exit 0
          fi
          unzip -o "$ZIP" -d .
          rm -f "$ZIP"
          rm -f .github/workflows/unpack-project.yml
          chmod +x gradlew || true

      - name: Commit unpacked project
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Ops Manual Android project"
          git push origin HEAD:main
